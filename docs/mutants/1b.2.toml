test = "npx vitest run --reporter=dot"
timeout = 300

# --- Обов'язкові з промпту 1b.2: apply лише після кнопки, стартові ваги з профілю, ізоляція userId ---

[[mutant]]
id = "M1"
file = "src/bot/onboarding.ts"
old = '''        const next = await save(userId, st, { planVariant: (st.planVariant + 1) % 3 });'''
new = '''        await repo.activatePlan(userId, (buildPlan(planProfile(await repo.getProfile(userId)), await repo.getPlanCatalog(), 0) as { plan: never }).plan, now());
        const next = await save(userId, st, { planVariant: (st.planVariant + 1) % 3 });'''
why = "план застосовується без [✅ Прийняти] (на [🔁])"
match = "підтвердження плану"

[[mutant]]
id = "M2"
file = "src/bot/workout-flow.ts"
old = '''h.length === 0 ? await repo.getStartWeight(userId, exercise.id) : null'''
new = '''null'''
why = "стартові ваги з профілю не доходять до прогресії"
match = "кг × 6"

[[mutant]]
id = "M3"
file = "src/db/repo.ts"
old = '''.where(and(eq(startWeights.userId, userId), eq(startWeights.exerciseId, exerciseId)))
        .get();'''
new = '''.where(eq(startWeights.exerciseId, exerciseId))
        .get();'''
why = "getStartWeight без userId — чужа робоча вага"
match = "чужий userId|іншого користувача"

