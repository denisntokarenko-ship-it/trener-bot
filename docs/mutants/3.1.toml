[[mutant]]
id = "M4"
file = "src/db/repo.ts"
old = '''      const res = await db.$client
        .prepare(
          `INSERT INTO ai_usage (user_id, model, input_tokens, output_tokens, cost_micro, purpose, local_date, created_at)
           SELECT u.id, ?, 0, 0, ?, ?, ?, ? FROM users u
           WHERE u.id = ? AND (SELECT COALESCE(SUM(cost_micro), 0) FROM ai_usage WHERE user_id = u.id AND local_date = ?) + ? <= ?`,
        )
        .bind(r.model, r.estMicro, r.purpose, r.localDate, now, userId, r.localDate, r.estMicro, r.limitMicro)
        .run();
'''
new = '''      if ((await this.aiSpendToday(userId, r.localDate)) + r.estMicro > r.limitMicro) return null;
      const res = await db.$client
        .prepare("INSERT INTO ai_usage (user_id, model, input_tokens, output_tokens, cost_micro, purpose, local_date, created_at) SELECT u.id, ?, 0, 0, ?, ?, ?, ? FROM users u WHERE u.id = ? AND ? = ? AND ? <= ?")
        .bind(r.model, r.estMicro, r.purpose, r.localDate, now, userId, r.localDate, r.localDate, r.estMicro, r.estMicro)
        .run();
'''
why = "перевірка суми окремо від INSERT (не атомарно): паралельні резервування обходять ліміт"
match = "10 паралельних"

