[[mutant]]
id = "M5"
file = "src/bot/chat-flow.ts"
old = '''    if (result.kind === "failed") {
      const e = result.error;
      const deadline = ac.signal.aborted;
      const f = deadline ? null : classifyAiError(e);
      if (u.responses > 0) await settle();'''
new = '''    if (result.kind === "failed") {
      const e = result.error;
      const deadline = ac.signal.aborted;
