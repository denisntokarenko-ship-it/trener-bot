# Мутанти завдання 4.2 (чат ШІ-тренера). M1–M2 — обов'язкові з промпту; решта — додаткові (облік, збої, форма запиту).
test = "npx vitest run --reporter=dot test/ai-chat.test.ts"
timeout = 300

[[mutant]]
id = "M1"
file = "src/bot/chat-flow.ts"
old = '''limitMicro: AI_DAILY_LIMIT_MICRO, exclusiveWithinMs: CHAT_INFLIGHT_MS }'''
new = '''limitMicro: 1_000_000_000_000, exclusiveWithinMs: CHAT_INFLIGHT_MS }'''
why = "прибрано перевірку денного ліміту: чат ходить за вичерпаного бюджету"
match = "P4[.]2[.]3|денні витрати на межі"

[[mutant]]
id = "M2"
file = "src/bot/chat-flow.ts"
old = '''    const kb = new InlineKeyboard().text(PROPOSAL_BTN_YES'''
new = '''    await repo.applyProposal(job.userId, id, now(), localDate(now(), DEFAULT_TZ));
    const kb = new InlineKeyboard().text(PROPOSAL_BTN_YES'''
why = "пропозиція застосовується без кнопки (одразу при відправці картки)"
match = "P4[.]2[.]4|без натискання"

[[mutant]]
