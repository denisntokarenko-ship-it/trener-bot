test = "npx vitest run --reporter=dot"
timeout = 300

# --- Обов'язкові з промпту 1b.4: прибрати екранування → червоний; текст > 4096 → червоний ---

[[mutant]]
id = "M1"
file = "src/bot/texts.ts"
old = '''  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");'''
new = '''  return s;'''
why = "esc() нічого не екранує — назва вправи з < ламає розмітку"
match = "P3.5|esc:"

[[mutant]]
id = "M2"
file = "src/bot/texts.ts"
old = '''  if (text.length <= TELEGRAM_TEXT_MAX) return text;
  const cut'''
new = '''  return text;
  const cut'''
why = "clip() не обрізає — текст понад 4096 символів"
match = "clip:|ліміти Telegram"

[[mutant]]
id = "M3"
file = "src/bot/texts.ts"
old = '''lines.push("", `<i>Варіант ${v.variant + 1} з 3. Нічого не зміниться, поки не натиснеш «Прийняти».</i>`);
  return clip(lines.join("\n"));'''
new = '''lines.push("", `<i>Варіант ${v.variant + 1} з 3. Нічого не зміниться, поки не натиснеш «Прийняти».</i>`);
  return lines.join("\n");'''
why = "екран плану без clip — 5 днів × 7 слотів вилазить за 4096"
match = "ліміти Telegram"

