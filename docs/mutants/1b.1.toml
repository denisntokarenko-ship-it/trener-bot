test = "npx vitest run --reporter=dot"
timeout = 300

# --- Обов'язкові з промпту 1b.1: спліт для 4 днів, виключення за обмеженням, «одна активна програма» ---

[[mutant]]
id = "M1"
file = "src/domain/plan.ts"
old = '''  4: { low: ["UP", "LO"], adv: ["UP", "LO"] },'''
new = '''  4: { low: ["FA", "FB"], adv: ["FA", "FB"] },'''
why = "спліт 4 днів: Верх/Низ → Все тіло"
match = "4 дн\\.|4 дні"

[[mutant]]
id = "M2"
file = "src/domain/plan.ts"
old = '''    if (item.stress.some((s) => limits.has(s))) continue;'''
new = '''    // (мутація) обмеження не враховуються'''
why = "виключення вправ за обмеженням прибрано"
match = "knee"

[[mutant]]
id = "M3"
file = "src/db/repo.ts"
old = '''UPDATE programs SET active = 0 WHERE user_id = ?'''
new = '''UPDATE programs SET active = 0 WHERE id = -1 AND user_id = ?'''
why = "стару програму не архівує: дві активні"
match = "активація|активн"

