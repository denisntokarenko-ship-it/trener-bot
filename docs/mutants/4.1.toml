# Мутанти завдання 4.1 (пропозиції ШІ, інструменти). M1–M3 — обов'язкові з промпту; решта — додаткові.
test = "npx vitest run --reporter=dot test/ai-tools.test.ts test/ai-chat-turns.test.ts"
timeout = 300

[[mutant]]
id = "M1"
file = "src/db/repo.ts"
old = '''WHERE id = ?2 AND user_id = ?3 AND status = 'pending' AND expires_at > ?1";'''
new = '''WHERE id = ?2 AND user_id = ?3 AND expires_at > ?1";'''
why = "applyProposal без перевірки status = pending"
match = "P4[.]1[.]5|паралельні натискання"

[[mutant]]
id = "M2"
file = "src/ai/tools.ts"
old = '''  const created = res.result === "created";'''
new = '''  if (res.result === "created") await c.repo.applyProposal(c.userId, res.proposal.id, c.now, localDate(c.now, c.tz));
  const created = res.result === "created";'''
why = "propose_change одразу застосовує зміну (пише в program_exercises) замість лише pending"
match = "валідна пропозиція|двічі"

[[mutant]]
id = "M3"
file = "src/db/repo.ts"
old = '''.prepare(`SELECT ${PROPOSAL_COLUMNS} FROM ai_proposals WHERE id = ? AND user_id = ?`).bind(id, userId)'''
new = '''.prepare(`SELECT ${PROPOSAL_COLUMNS} FROM ai_proposals WHERE id = ? AND ? IS NOT NULL`).bind(id, userId)'''
why = "прибрати перевірку userId у getProposal (чужа пропозиція видима)"
match = "чужий userId"

[[mutant]]
id = "M4"
file = "src/db/repo.ts"
old = '''WHERE user_id = ? AND status = 'pending' AND expires_at <= ?").bind(now, userId, now),'''
new = '''WHERE user_id = ? AND status = 'pending' AND expires_at <= ? AND 0").bind(now, userId, now),'''
why = "createProposal не гасить прострочені pending — предмет заблоковано до крону"
match = "прострочений pending"

[[mutant]]
id = "M5"
file = "src/db/repo.ts"
old = '''id NOT IN (SELECT id FROM chat_turns WHERE user_id = ?1 ORDER BY id DESC LIMIT ?2)")'''
new = '''id NOT IN (SELECT id FROM chat_turns WHERE ?1 IS NOT NULL ORDER BY id DESC LIMIT ?2)")'''
why = "підзапит обрізання chat_turns без user_id — хвіст власних рядків вважається зайвим через чужі новіші"
match = "P4[.]1[.]7|12 пар"

