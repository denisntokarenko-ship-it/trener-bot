test = "npx vitest run --reporter=dot"
timeout = 300

# --- Обов'язкові з промпту 1.1 ---

[[mutant]]
id = "M1"
file = "src/db/repo.ts"
old = '''
        ON CONFLICT (workout_id, exercise_id, set_no) DO UPDATE SET program_exercise_id = excluded.program_exercise_id, weight_kg = excluded.weight_kg, reps = excluded.reps, prescribed_weight_kg = excluded.prescribed_weight_kg, prescribed_reps = excluded.prescribed_reps, skipped = excluded.skipped`);'''
new = '''`);'''
why = "upsertSet — звичайний INSERT замість ON CONFLICT DO UPDATE"
match = "двічі той самий"

[[mutant]]
id = "M2"
file = "src/db/repo.ts"
old = '''.where(and(eq(workouts.userId, userId), eq(workouts.status, "active")))'''
new = '''.where(eq(workouts.status, "active"))'''
why = "getActiveWorkout без фільтра user_id"
match = "B не бачить і не змінює тренування A"

[[mutant]]
id = "M3"
file = "src/db/repo.ts"
old = '''export const STALE_AFTER_MS = 4 * 60 * 60 * 1000;'''
new = '''export const STALE_AFTER_MS = 0;'''
why = "поріг abandonStale 4 год → 0"
match = "чіпає лише active, старші за 4 год"

