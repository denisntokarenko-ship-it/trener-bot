# --- Обов'язкові з промпту 2.3 ---

[[mutant]]
id = "M1"
file = "src/reminders.ts"
old = '''  if (await c.repo.hasReminder(user.id, kind, date)) return "skipped";
  if (!(await wanted(c.repo, user, kind, date))) return "skipped";
  // 1. Заявка: 0 рядків — інший тік уже взяв.
  if (!(await c.repo.claimReminder(user.id, kind, date, c.now))) return "skipped";'''
new = '''  if (!(await wanted(c.repo, user, kind, date))) return "skipped";
  await c.repo.claimReminder(user.id, kind, date, c.now);'''
why = "прибрати перевірку reminders_sent (і попередню, і за результатом claim) — другий тік шле дубль"
match = "другий тік|два виклики|гонка"

[[mutant]]
