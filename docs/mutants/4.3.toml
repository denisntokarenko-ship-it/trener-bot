# Мутанти завдання 4.3 (недільний коментар ШІ, прострочення пропозицій у кроні). M1 — обов'язковий з промпту; решта — додаткові.
test = "npx vitest run --reporter=dot test/ai-weekly.test.ts"
timeout = 300

[[mutant]]
id = "M1"
file = "src/ai/weekly-comment.ts"
old = '''    console.warn("weekly comment failed", { error: errorName(e) });
    return null;'''
