      <stop offset="0" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FF2D00"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <g transform="translate(0 12)" opacity="0.28"><g transform="translate(320 255) scale(1.28) rotate(-35) translate(-320 -255)">
    <rect x="175" y="241" width="290" height="28" rx="10" fill="#7A1200"/>
    <rect x="203" y="185" width="44" height="140" rx="14" fill="#7A1200"/>
    <rect x="393" y="185" width="44" height="140" rx="14" fill="#7A1200"/>
    <rect x="160" y="213" width="40" height="84" rx="12" fill="#7A1200"/>
    <rect x="440" y="213" width="40" height="84" rx="12" fill="#7A1200"/>
  </g></g>
  <g transform="translate(320 255) scale(1.28) rotate(-35) translate(-320 -255)">
