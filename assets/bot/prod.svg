    <rect x="203" y="185" width="44" height="140" rx="14" fill="#FFFFFF"/>
    <rect x="393" y="185" width="44" height="140" rx="14" fill="#FFFFFF"/>
    <rect x="160" y="213" width="40" height="84" rx="12" fill="#FFFFFF"/>
