    <circle cx="448" cy="470" r="86" fill="#16A34A" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M407 472 L437 502 L491 440" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
