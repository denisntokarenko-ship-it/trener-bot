<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- Тренер: робочий бот. Теплий жовто-червоний фон, біла гантеля, зелена позначка «виконано». Усе в межах вписаного кола (Telegram обрізає аватарку колом). -->
